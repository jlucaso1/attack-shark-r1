[package]
name = "attack-shark-r1"
version = "0.1.0"
edition = "2024"
authors = ["jlucaso"]
description = "High-performance Rust driver and CLI for the Attack Shark R1 wireless/wired mouse"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
rusb = "0.9"
device-driver = { version = "2.1.1", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
rust-ini = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lib]
name = "attack_shark_r1"
path = "src/lib.rs"

[[bin]]
name = "attack-shark-r1"
path = "src/main.rs"
