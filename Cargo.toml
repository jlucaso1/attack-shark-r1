[package]
name = "attack-shark-r1"
version = "0.1.0"
edition = "2024"
authors = ["jlucaso"]
description = "High-performance Rust driver and CLI for the Attack Shark R1 wireless/wired mouse"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
rusb = "0.9"
device-driver = { version = "2.1.1", features = ["macros"] }
usage = { package = "usage-rs", version = "6", default-features = false, features = ["help"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "attack_shark_r1"
path = "src/lib.rs"

[[bin]]
name = "attack-shark-r1"
path = "src/main.rs"
